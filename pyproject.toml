[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mujoco-orbit"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
viewer = [
    "viser>=0.2.0",
    "trimesh>=4.0",
]
report = [
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_orbit", "src/viewer"]
include = ["src/mujoco_orbit/testdata/*.xml"]

[tool.hatch.build.targets.sdist]
include = ["src/mujoco_orbit/testdata/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
