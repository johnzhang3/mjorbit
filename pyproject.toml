[build-system]
requires = ["scikit-build-core>=0.9", "mujoco>=3.7,<3.8", "nanobind>=2.5"]
build-backend = "scikit_build_core.build"

[project]
name = "mjorbit"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cvxpy>=1.7.5",
    "mujoco>=3.7,<3.8",
    "numpy>=1.26,<2",
    "pillow>=10.0",
    "scipy>=1.11",
    "trimesh>=4.0",
    "viser>=0.2.0",
]

[project.scripts]
mjo-viewer = "viewer.app:main"

[project.optional-dependencies]
report = [
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
]
warp = [
    "mujoco-warp>=3.6.0",
]
frames = [
    "astropy>=6.0",
]

[tool.scikit-build]
cmake.source-dir = "src/cpp"
cmake.version = ">=3.16"
# Skip the C++ test executables when building the wheel via pip / scikit-build-core.
# They only matter for local development (`pixi run cpp-test`), and they pull in
# pthreads/libdl which can fail to link inside pip's isolated build env on conda
# Linux setups (compiler_compat libdl vs glibc mismatch).
cmake.define = { MJORBIT_BUILD_TESTS = "OFF" }
wheel.packages = ["src/mjorbit", "src/mjorbit_warp", "src/viewer"]
# ship XML testdata with the wheel
wheel.exclude = []
sdist.include = [
    "src/mjorbit/testdata/*.xml",
    "src/mjorbit_warp/**/*.py",
    "src/viewer/assets/*",
    "src/cpp/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.12"
