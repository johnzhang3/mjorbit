[build-system]
requires = ["scikit-build-core>=0.9", "mujoco>=3.3"]
build-backend = "scikit_build_core.build"

[project]
name = "mujoco-orbit"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cvxpy>=1.7.5",
    "mujoco>=3.3",
    "numpy>=1.26,<2",
    "trimesh>=4.0",
    "viser>=0.2.0",
]

[project.optional-dependencies]
report = [
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
]

[tool.scikit-build]
cmake.source-dir = "src/cpp"
cmake.version = ">=3.16"
wheel.packages = ["src/mujoco_orbit", "src/viewer"]
# ship XML testdata with the wheel
wheel.exclude = []
sdist.include = ["src/mujoco_orbit/testdata/*.xml", "src/cpp/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.12"
