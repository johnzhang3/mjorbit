<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="earth" cx="18%" cy="118%" r="70%">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="0.55" stop-color="#13315c"/>
      <stop offset="1" stop-color="#0a1526"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8c1a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8c1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="180" cy="90" r="1.5"/><circle cx="420" cy="150" r="1"/><circle cx="900" cy="80" r="1.6"/>
    <circle cx="1120" cy="180" r="1.2"/><circle cx="1010" cy="320" r="1"/><circle cx="760" cy="120" r="1.3"/>
    <circle cx="300" cy="300" r="1"/><circle cx="1180" cy="460" r="1.4"/><circle cx="620" cy="60" r="1"/>
  </g>
  <!-- earth limb bottom-left -->
  <circle cx="40" cy="900" r="560" fill="url(#earth)"/>
  <circle cx="40" cy="900" r="560" fill="none" stroke="#7fc4ff" stroke-opacity="0.25" stroke-width="3"/>
  <!-- orbit arc -->
  <ellipse cx="640" cy="360" rx="500" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="6 9"/>
  <!-- satellite glyph -->
  <g transform="translate(1010,250)" opacity="0.9">
    <rect x="-14" y="-10" width="28" height="20" rx="3" fill="#d8d2c6"/>
    <rect x="-52" y="-5" width="30" height="10" fill="#3a6ea5"/>
    <rect x="22" y="-5" width="30" height="10" fill="#3a6ea5"/>
  </g>
  <!-- play button -->
  <circle cx="640" cy="330" r="58" fill="rgba(255,255,255,0.10)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M620 300 L620 360 L672 330 Z" fill="#ffffff" fill-opacity="0.92"/>
  <!-- glow behind text -->
  <ellipse cx="640" cy="470" rx="420" ry="120" fill="url(#glow)"/>
  <text x="640" y="468" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#ffffff">(d)&#160;&#160;RL Truss Pointing</text>
  <text x="640" y="512" text-anchor="middle" font-family="monospace" font-size="20" letter-spacing="3" fill="#ff8f86">PREVIEW&#160;COMING&#160;SOON</text>
</svg>
