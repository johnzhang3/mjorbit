name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build project page and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code and documentation
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.53.0
          environments: docs
          cache: true
          locked: true

      - name: Build documentation
        run: pixi run -e docs docs-build

      - name: Check out the existing project page
        uses: actions/checkout@v6
        with:
          repository: johnzhang3/mjorbit
          ref: gh-pages
          path: docs/_build/project-page
          persist-credentials: false

      - name: Assemble the combined site
        run: >-
          pixi run -e docs python scripts/build_pages.py
          --project-dir docs/_build/project-page
          --docs-dir docs/_build/html
          --output-dir docs/_build/site

      - name: Save a reviewable site preview
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: docs/_build/site
          retention-days: 14

      - name: Package the site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/site

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@v4
