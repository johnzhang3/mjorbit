name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.pixi-environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pixi-environment: ["py311", "py312"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.53.0
          environments: ${{ matrix.pixi-environment }}
          cache: true
          locked: true

      - name: Run tests
        run: pixi run -e ${{ matrix.pixi-environment }} test

      - name: Lint and type check
        if: matrix.pixi-environment == 'py312'
        run: |
          pixi run -e py312 lint
          pixi run -e py312 typecheck

      - name: Native tests and starter example
        if: matrix.pixi-environment == 'py312'
        run: |
          pixi run -e py312 cpp-test
          pixi run -e py312 example-minimal

  frames:
    name: Optional frame conversions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.53.0
          environments: frames
          cache: true
          locked: true
      - run: pixi run -e frames test-frames

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.53.0
          environments: docs
          cache: true
          locked: true
      - run: pixi run -e docs docs-build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html

  packaging:
    name: Release artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.53.0
          environments: default
          cache: true
          locked: true
      # Resolve runtime dependencies afresh in temporary venvs, outside the
      # checkout. This catches issues hidden by an editable/locked dev install.
      - run: pixi run package-check
