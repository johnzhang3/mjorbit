name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.pixi-environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pixi-environment: ["py311", "py312"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.53.0
          environments: ${{ matrix.pixi-environment }}
          cache: true
          locked: true

      - name: Run tests
        run: pixi run -e ${{ matrix.pixi-environment }} test
