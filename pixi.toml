[workspace]
name = "mjorbit"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.13"
pip = "*"
cmake = ">=3.16"
ninja = "*"
cxx-compiler = "*"

[pypi-dependencies]
mjorbit = { path = ".", editable = true }
nanobind = ">=2.5"

[feature.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.8.0"
pyright = ">=1.1.0"

[feature.dev.pypi-dependencies]
build = ">=1.2,<2"

[feature.docs.pypi-dependencies]
sphinx = ">=8,<9"
myst-parser = ">=4,<5"
sphinx-book-theme = ">=1.1,<2"
sphinx-copybutton = ">=0.5,<1"

[feature.report.pypi-dependencies]
matplotlib = ">=3.10.8"
scipy = ">=1.17.1"

[feature.warp]
# mujoco-warp publishes wheels only for linux-64 (manylinux_2_28_x86_64) and
# win-amd64 / osx-arm64. Restrict the warp environment to linux-64 to keep the
# default and report envs solvable on osx-64. macOS users should use the CPU
# (mjorbit) backend only.
platforms = ["linux-64"]

[feature.warp.pypi-dependencies]
mujoco-warp = ">=3.6.0"

# astropy is pure-Python (+ numpy/scipy/pyerfa wheels) and cross-platform, so unlike
# `feature.warp` the frames extra needs no `platforms` restriction.
[feature.frames.pypi-dependencies]
astropy = ">=6.0"

[feature.rl]
# RL training stacks on the warp backend; torch + rsl-rl are linux-64-only here
# for the same wheel-availability reasons as the warp feature.
platforms = ["linux-64"]

[feature.rl.pypi-dependencies]
# examples/ppo targets the 5.x TensorDict VecEnv API.
rsl-rl-lib = ">=5.4,<6"
torch = ">=2.6"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[environments]
default = ["dev", "py312"]
py311 = ["dev", "py311"]
py312 = ["dev", "py312"]
report = ["dev", "py312", "report"]
docs = ["dev", "py312", "docs"]
# warp includes the frames feature (pure-Python astropy) so GPU users can feed
# TLE/TEME or Earth-fixed states directly and the epoch/frame warp tests run.
warp = ["dev", "py312", "warp", "frames"]
frames = ["dev", "py312", "frames"]
rl = ["dev", "py312", "warp", "rl"]

[tasks]
sync-package = { cmd = "python -m pip install -e . --no-deps --force-reinstall && cmake --install build/cpp --prefix $(python -c 'import sysconfig; print(sysconfig.get_paths()[\"platlib\"])')", depends-on = ["cpp-build"] }
test = { cmd = "pytest -q", depends-on = ["sync-package"] }
test-api = { cmd = "pytest tests/mjorbit/test_api_model_data.py -q", depends-on = ["sync-package"] }
test-warp = { cmd = "pytest tests/mjorbit_warp -q", depends-on = ["sync-package"] }
test-frames = { cmd = "pytest tests/mjorbit/test_frames.py -q", depends-on = ["sync-package"] }
lint = "ruff check ."
typecheck = "pyright --pythonpath $(python -c 'import sys; print(sys.executable)')"
typecheck-warp = "pyright -p pyrightconfig-warp.json --pythonpath $(python -c 'import sys; print(sys.executable)')"
check = { depends-on = ["lint", "typecheck", "test"] }
viewer = { cmd = "python -m viewer", depends-on = ["sync-package"] }
example-minimal = { cmd = "python examples/minimal.py", depends-on = ["sync-package"] }
example-batched = { cmd = "python examples/batched.py", depends-on = ["sync-package"] }
build-dist = "python -m build"
package-check = "python scripts/check_release.py"
# Run with the warp env: pixi run -e warp banner-viewer-gpu
banner-viewer-gpu = { cmd = "python examples/banner_viewer_gpu.py", depends-on = ["sync-package"] }
example-free-drift = { cmd = "python examples/free_drift.py", depends-on = ["sync-package"] }
example-mppi-arm-reach = { cmd = "python examples/mppi/arm_reach.py", depends-on = ["sync-package"] }
example-mppi-capture = { cmd = "python examples/mppi/capture_stabilize.py", depends-on = ["sync-package"] }
example-docking = { cmd = "python examples/docking/main_mppi.py", depends-on = ["sync-package"] }
example-reorient = { cmd = "python examples/reorient_mppi_3dof.py", depends-on = ["sync-package"] }
example-reorient-viewer = { cmd = "python examples/reorient_mppi_3dof_viewer.py", depends-on = ["sync-package"] }
ppo-truss-train = { cmd = "python examples/ppo/train.py", depends-on = ["sync-package"] }
basilisk-multibody-experiment = { cmd = "python experiments/basilisk_multibody/run.py", depends-on = ["sync-package"] }
cpp-configure = "cmake -S src/cpp -B build/cpp -DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)') -DCMAKE_BUILD_TYPE=Release"
cpp-build = { cmd = "cmake --build build/cpp -j", depends-on = ["cpp-configure"] }
cpp-test = { cmd = "ctest --test-dir build/cpp --output-on-failure", depends-on = ["cpp-build"] }

[feature.docs.tasks]
docs-build = { cmd = "sphinx-build -W --keep-going -b html docs docs/_build/html", depends-on = ["sync-package"] }
docs-serve = { cmd = "python -m http.server 8000 --bind 127.0.0.1 --directory docs/_build/html", depends-on = ["docs-build"] }
